<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enneagram Profiler — RHETI-style assessment</title>
<style>
  :root{
    --bg:#FFFFFF; --ink:#000000; --ink2:rgba(0,0,0,.55);
    --line:#000000; --line2:rgba(0,0,0,.14);
    --accent:#000000; --accent-ink:#FFFFFF; --soft:rgba(0,0,0,.05); --tint:#F5F9FC;
    --panel:#F2F2F0; --panel-hi:#E7E7E4; --hover:#EDEDEA; --track:rgba(0,0,0,.09);
    --gut:clamp(20px,5vw,64px);
    --body:#FE7445; --heart:#CDABFE; --head:#33AAFF; --inst:#D1DDD3;
    --body-soft:#FFE9E0; --heart-soft:#F3ECFF; --head-soft:#E3F2FF; --inst-soft:#EDF2EE;
    --danger:#FE7445; --on-dom:#000000;
    --grot:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    --mono:"Geist Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--grot);font-weight:500;
    letter-spacing:-.01em;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:720px;margin:0 auto;padding:0 22px 90px}
  body.testing .wrap{padding-bottom:22px}
  h1,h2,h3{font-family:var(--grot);text-wrap:balance;margin:0;font-weight:500;letter-spacing:-.04em}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0;text-transform:uppercase;
    color:var(--ink);font-weight:400}
  button{font-family:var(--grot);cursor:pointer}
  .btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:2px;
    padding:14px 28px;font-size:15px;font-weight:500;letter-spacing:-.01em}
  .btn:hover{background:rgba(0,0,0,.8)}
  .btn:focus-visible,.dot:focus-visible,.btn2:focus-visible{outline:3px solid var(--head);outline-offset:2px}
  .btn2{background:transparent;color:var(--ink);border:1px solid var(--ink);
    border-radius:2px;padding:10px 18px;font-size:14px;font-weight:500}
  .btn2:hover{background:var(--soft)}
  .muted{color:var(--ink2)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .sect{margin-top:56px}
  .sect>.eyebrow{display:block;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .swatch{width:10px;height:10px;border-radius:0;flex:none}

  /* ---------- intro (full-bleed) ---------- */
  #intro{margin:0 calc(50% - 50vw + var(--sbw,0px)/2);width:calc(100vw - var(--sbw,0px))}
  #intro>*:not(.hero){padding-left:max(var(--gut),calc(50% - 760px));
    padding-right:max(var(--gut),calc(50% - 760px))}
  .hero{background:var(--heart);padding:18px max(var(--gut),calc(50% - 760px)) 60px}
  .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(60px,14vh,130px)}
  .brandchip{background:var(--ink);color:var(--accent-ink);font-family:var(--grot);
    font-weight:700;font-size:20px;letter-spacing:-.03em;padding:4px 10px 6px}
  .masthead .brand{font-family:var(--mono);font-size:13px;text-transform:uppercase;color:var(--ink)}
  #intro h1{font-size:clamp(42px,11vw,132px);line-height:.92;margin:12px 0 26px;letter-spacing:-.055em}
  #intro .sub{font-size:clamp(16px,1.5vw,20px);color:var(--ink);max-width:52ch;margin:0;line-height:1.35}
  #intro .strand{margin:0}
  #intro .strand i{height:clamp(44px,7vh,70px)}
  .spec{display:grid;grid-template-columns:repeat(4,1fr);margin:46px 0 0;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .spec>div{padding:22px 20px 22px 0}
  .spec>div+div{border-left:1px solid var(--line);padding-left:20px}
  .spec dt{font-family:var(--grot);font-weight:500;font-size:clamp(34px,4vw,54px);letter-spacing:-.04em;
    line-height:1;margin:0 0 10px;font-variant-numeric:tabular-nums}
  .spec dd{margin:0;font-family:var(--mono);font-size:11px;text-transform:uppercase;
    color:var(--ink2);line-height:1.5;letter-spacing:0;max-width:34ch}
  .note{font-size:15px;color:var(--ink2);margin:24px 0 0;max-width:70ch}
  .domline{display:flex;gap:8px 26px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;
    text-transform:uppercase;margin:16px 0 0}
  .domline span{display:flex;gap:7px;align-items:center}
  #intro .row{margin-top:38px !important}
  @media (max-width:560px){
    .spec{grid-template-columns:1fr 1fr}
    .spec>div{padding:16px 12px 16px 0}
    .spec>div+div{border-left:none;padding-left:0}
    .spec>div:nth-child(even){border-left:1px solid var(--line);padding-left:12px}
    .spec>div:nth-child(n+3){border-top:1px solid var(--line)}
  }

  /* ---------- primer ---------- */
  #primer{padding-top:30px}
  #primer h2{font-size:clamp(30px,6vw,44px);letter-spacing:-.045em;line-height:1.02;margin:10px 0 8px}
  .prule{display:grid;grid-template-columns:40px 1fr;gap:14px;padding:15px 0;
    border-bottom:1px solid var(--line2);font-size:15px;line-height:1.45}
  .prule .n{font-family:var(--mono);font-size:12px;color:var(--ink2);padding-top:2px}
  .scale.mini{max-width:380px;margin:30px 0 10px}
  .minilbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--ink2);
    max-width:380px;display:flex;justify-content:space-between}

  /* ---------- test ---------- */
  #test{display:none;flex-direction:column;min-height:calc(100vh - 48px);
    min-height:calc(100svh - 48px);padding-top:22px}
  .topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;
    font-family:var(--mono);font-size:12px;text-transform:uppercase;font-variant-numeric:tabular-nums}
  .progress{height:3px;background:var(--track);overflow:hidden}
  .progress i{display:block;height:100%;background:var(--ink);width:0%;transition:width .3s}
  .teststage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0 30px}
  .partlbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--ink2);margin-bottom:14px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
  .stmt{background:var(--panel);font-family:var(--grot);font-weight:500;font-size:clamp(18px,2vw,23px);
    letter-spacing:-.03em;line-height:1.3;padding:26px 24px;min-height:150px;
    display:flex;align-items:center;text-wrap:balance;transition:background .15s}
  .stmt.hot{background:var(--panel-hi)}
  .stmt.picked{background:var(--heart)}
  body.part2 .stmt.picked{background:var(--inst)}
  .scale{display:flex;justify-content:space-between;align-items:center;margin:42px 2px 0;gap:6px;position:relative}
  .scale::before{content:"";position:absolute;left:10px;right:10px;top:50%;height:1px;background:var(--track)}
  .dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--ink);background:var(--bg);
    flex:none;transition:transform .1s,background .1s;position:relative;z-index:1}
  .dot:hover{transform:scale(1.14);background:var(--hover)}
  .dot.sel{background:var(--ink);border-color:var(--ink)}
  .dot.big{width:42px;height:42px}
  .keynums{display:flex;justify-content:space-between;margin:10px 8px 0;font-family:var(--mono);
    font-size:11px;color:var(--ink2)}
  .keynums span{width:30px;text-align:center}
  .keynums span:first-child,.keynums span:last-child{width:42px}
  .scalelabels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;
    text-transform:uppercase;color:var(--ink2);margin:16px 2px 0}
  .scalelabels span{max-width:140px;line-height:1.5}
  .scalelabels .r{text-align:right}
  .scalelabels .c{text-align:center}
  .interlude{display:none;flex:1;flex-direction:column;justify-content:center;padding:24px 0 30px}
  .interlude h2{font-size:clamp(28px,5vw,40px);margin:10px 0 14px}
  .interlude p{font-size:16px;max-width:56ch;margin:0 0 10px}
  @media (max-width:560px){
    .teststage{justify-content:flex-start;padding:18px 0 20px}
    .pair{grid-template-columns:1fr;gap:10px}
    .stmt{min-height:111px;padding:38px 20px 20px}
    #test .stmt-badge{display:flex;position:absolute;top:10px;left:10px;width:23px;height:23px;
      align-items:center;justify-content:center;border-radius:50%;background:var(--ink);color:var(--accent-ink);
      font-family:var(--mono);font-size:11px;font-weight:400}
    #test .answer-prompt{display:block;margin:16px 0 10px;font-family:var(--mono);font-size:11px;
      color:var(--ink2);text-transform:uppercase}
    /* Proposal C: turn the five-point scale into five labelled, tap-sized choices. */
    #scale{display:grid;grid-template-columns:1fr;row-gap:14px;margin:0}
    #scale::before{display:none}
    #scale .dot,#scale .dot.big{width:auto;height:auto;min-height:52px;border-radius:0;
      display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel);border:none;
      font-size:14px;font-weight:500;text-align:left}
    #scale .dot:hover{transform:none;background:var(--hover)}
    #scale .dot[data-v="-2"],#scale .dot[data-v="2"]{border-left:3px solid #383835;font-size:15px}
    #scale .dot[data-v="-1"],#scale .dot[data-v="1"]{margin-left:40px}
    #scale .dot[data-v="0"]{margin-left:12px;background:var(--panel-hi)}
    #scale .dot.sel{outline:2px solid var(--head);outline-offset:-2px}
    #test #scale .answer-label,#primer .mobile-primer-ballot .answer-label{display:block}
    #scale .answer-badge,#primer .mobile-primer-ballot .answer-badge{display:flex;width:30px;height:30px;align-items:center;justify-content:center;
      flex:none;border:1px solid #383835;border-radius:50%;background:transparent;color:var(--ink);font-family:var(--mono);font-size:11px}
    #scale .dot[data-v="-2"] .answer-badge,#scale .dot[data-v="2"] .answer-badge,
    #primer .primer-choice[data-v="-2"] .answer-badge,#primer .primer-choice[data-v="2"] .answer-badge{
      border:none;background:#383835;color:var(--accent-ink)}
    #scale .dot[data-v="0"] .answer-badge,#primer .primer-choice[data-v="0"] .answer-badge{border:none;background:var(--bg)}
    #test .choice-help{display:block;margin:24px 0 0;color:var(--ink2)}
    .choice-help b{display:block;margin-bottom:4px;font-family:var(--mono);font-size:11px;font-weight:400;text-transform:uppercase}
    .choice-help p{margin:0;font-size:15px;line-height:1.4}
    .keynums,.scalelabels{display:none}
    #primer .scale.mini,#primer .minilbl{display:none}
    #primer .mobile-primer-ballot{display:grid;row-gap:14px;margin:30px 0 8px}
    #primer .primer-choice{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 12px;background:var(--panel);font-size:14px;font-weight:500}
    #primer .primer-choice[data-v="-2"],#primer .primer-choice[data-v="2"]{border-left:3px solid #383835;font-size:15px}
    #primer .primer-choice[data-v="-1"],#primer .primer-choice[data-v="1"]{margin-left:40px}
    #primer .primer-choice[data-v="0"]{margin-left:12px;background:var(--panel-hi)}
    .topbar{padding-right:52px}
  }
  .answer-label{display:none}
  .stmt{position:relative}
  .stmt-badge,.answer-prompt,.choice-help,.answer-badge,.mobile-primer-ballot{display:none}

  /* ---------- results ---------- */
  #results{display:none;padding-top:26px}
  #results h2{letter-spacing:-.045em;line-height:1.02}
  .headline{display:grid;grid-template-columns:1fr 300px;gap:26px;align-items:center;margin-top:14px}
  .headline h2{font-size:clamp(34px,6vw,56px)}
  .codechips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
  .codechip{font-family:var(--mono);font-size:12px;text-transform:uppercase;border:1px solid var(--ink);
    padding:6px 10px;background:var(--bg)}
  .codechip.solid{background:var(--ink);color:var(--accent-ink)}
  .ennea{width:100%;max-width:300px;justify-self:end}
  .ennea .ring{fill:none;stroke:var(--ink);stroke-width:1}
  .ennea .inner{fill:none;stroke:rgba(0,0,0,.18);stroke-width:1}
  .ennea .stress{stroke:var(--danger);stroke-width:2;fill:none}
  .ennea .growth{stroke:var(--ink);stroke-width:2;fill:none}
  .ennea .wing{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:3 3}
  .ennea text{font-family:var(--mono);font-size:13px;fill:var(--ink)}
  .ennea .lbl{font-size:10px;text-transform:uppercase;fill:var(--ink2)}
  .type-card{background:var(--tint);border-left:6px solid var(--dc,var(--ink));padding:22px 24px;margin-top:14px}
  .type-card h3{font-size:26px;margin:3px 0 0;letter-spacing:-.035em}
  .type-card.minor h3{font-size:20px}
  .chip{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:400;text-transform:uppercase;color:var(--ink)}
  .type-card .blk{margin-top:12px;font-size:14px}
  .type-card .blk b{display:block;font-family:var(--mono);font-weight:400;font-size:11px;
    text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin-top:14px}
  .kv .blk{margin-top:0}
  .statline{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--ink2);margin-top:4px}
  .ranklist{display:grid;margin-top:4px}
  .rankrow{display:grid;grid-template-columns:34px 170px 1fr 44px 36px;gap:4px 10px;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--line2);font-size:14px;font-variant-numeric:tabular-nums}
  .rankrow>.muted{font-family:var(--mono);font-size:12px}
  .rankrow .name{font-weight:500;display:flex;gap:8px;align-items:center;white-space:nowrap}
  .rankrow .desc{grid-column:2/-1;font-size:12px;color:var(--ink2);letter-spacing:0}
  .bar{height:14px;background:var(--soft);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--dc,var(--ink))}
  .delta{font-family:var(--mono);font-size:11px;text-align:right;color:var(--ink)}
  .delta.down{color:var(--danger)}
  .strand{display:flex;gap:2px;align-items:center;margin:24px 0 6px}
  .strand i{flex:1;height:44px;border-radius:0;background:var(--sc)}
  .strand i.dim{opacity:.25}
  .stackbar{display:flex;gap:2px;height:18px;margin:22px 0 8px}
  .stackbar i{display:block;height:100%}
  .stacklegend{display:flex;gap:12px 20px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;
    text-transform:uppercase;color:var(--ink);margin-bottom:4px;font-variant-numeric:tabular-nums}
  .stacklegend span{display:flex;gap:7px;align-items:center}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin:14px 0 8px}
  .cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
  .tile{background:var(--soft);padding:14px 14px 16px;border-top:3px solid var(--dc)}
  .tile .rk{font-family:var(--grot);font-weight:500;font-size:34px;letter-spacing:-.04em;line-height:1;
    display:block;font-variant-numeric:tabular-nums}
  .tile .nm{font-weight:500;display:block;margin-top:6px}
  .tile .sm{font-size:12px;color:var(--ink2);display:block;margin-top:4px;line-height:1.4}
  .arrows{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .arrow{padding:16px 18px;border:1px solid var(--line);font-size:14px}
  .arrow b{display:block;font-family:var(--mono);font-weight:400;font-size:11px;text-transform:uppercase;margin-bottom:8px}
  .arrow.st b{color:var(--danger)}
  .arrow .big{font-size:22px;letter-spacing:-.03em;display:block;margin-bottom:6px;font-weight:500}
  .verdict{background:var(--ink);color:var(--accent-ink);padding:26px 28px;font-size:16px;line-height:1.55;letter-spacing:-.01em}
  .verdict p{margin:0 0 15px}
  .verdict p:last-child{margin:0}
  @media (max-width:560px){
    .headline{grid-template-columns:1fr}
    .ennea{justify-self:start}
    .rankrow{grid-template-columns:28px 130px 1fr 40px}
    .rankrow .delta{display:none}
    .cols2,.kv,.arrows{grid-template-columns:1fr}
    .cols3{grid-template-columns:1fr}
    .strand i{height:28px}
  }

  /* ---------- history / misc ---------- */
  #history{margin-top:60px}
  .histrow{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line2)}
  .langbtn{position:fixed;top:14px;right:14px;z-index:10;background:var(--ink);color:var(--accent-ink);
    border:none;border-radius:0;padding:8px 14px;font-family:var(--mono);font-size:13px;font-weight:400}
  .langbtn:hover{background:rgba(0,0,0,.8)}
  .exitbtn{background:none;border:none;padding:0;font-family:var(--mono);font-size:12px;
    text-transform:uppercase;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .exitbtn:hover{color:var(--danger)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);
    color:var(--accent-ink);padding:12px 22px;border-radius:0;font-family:var(--mono);font-size:12px;
    text-transform:uppercase;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}
  kbd{background:var(--soft);border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-size:11px}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }

  @media print{
    body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .langbtn,.toast,#results .row,#results .row+p{display:none !important}
    .wrap{max-width:100%;padding:0}
    .sect{margin-top:24px}
    .sect>.eyebrow{break-after:avoid}
    .type-card,.verdict,.rankrow,.stackbar,.stacklegend,.tile,.arrow,.headline{break-inside:avoid}
    .strand i{height:26px}
  }
</style>
</head>
<body>
<button class="langbtn" id="langBtn" aria-label="Switch language">RU</button>
<div class="wrap">

  <!-- ============ INTRO ============ -->
  <section id="intro">
    <header class="masthead hero">
      <div class="topline"><span class="brandchip">EP 26</span></div>
      <div class="brand" id="iEyebrow"></div>
      <h1 id="iTitle">Enneagram Profiler</h1>
      <p class="sub" id="iSub"></p>
    </header>
    <div class="strand" id="iStrand" aria-hidden="true"></div>

    <dl class="spec">
      <div><dt>144</dt><dd id="iS1"></dd></div>
      <div><dt>+18</dt><dd id="iS2"></dd></div>
      <div><dt>0</dt><dd id="iS3"></dd></div>
      <div><dt>~35</dt><dd id="iS4"></dd></div>
    </dl>
    <p class="note" id="iNote"></p>
    <div class="domline" id="iDomLine"></div>

    <div class="row" style="margin-top:34px">
      <button class="btn" id="startBtn">Start the assessment</button>
    </div>
    <div id="resumeBox" style="display:none;margin-top:14px">
      <button class="btn2" id="resumeBtn">Resume unfinished attempt</button>
    </div>

    <div id="history"></div>
  </section>

  <!-- ============ PRIMER ============ -->
  <section id="primer" style="display:none">
    <div class="eyebrow" id="pEyebrow"></div>
    <h2 id="pTitle"></h2>
    <div id="pList"></div>
    <div class="scale mini" aria-hidden="true">
      <span class="dot big"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot big"></span>
    </div>
    <div class="minilbl" id="pMini"></div>
    <div class="mobile-primer-ballot" aria-hidden="true">
      <span class="primer-choice" data-v="-2"><span class="answer-badge">A</span><span class="answer-label primer-answer-label"></span></span>
      <span class="primer-choice" data-v="-1"><span class="answer-badge">A</span><span class="answer-label primer-answer-label"></span></span>
      <span class="primer-choice" data-v="0"><span class="answer-badge">=</span><span class="answer-label primer-answer-label"></span></span>
      <span class="primer-choice" data-v="1"><span class="answer-badge">B</span><span class="answer-label primer-answer-label"></span></span>
      <span class="primer-choice" data-v="2"><span class="answer-badge">B</span><span class="answer-label primer-answer-label"></span></span>
    </div>
    <button class="btn" id="primerBtn" style="margin-top:30px"></button>
  </section>

  <!-- ============ TEST ============ -->
  <section id="test">
    <div class="topbar">
      <span class="eyebrow" id="counter">Item 1 of 144</span>
      <button class="exitbtn" id="exitBtn">Exit</button>
    </div>
    <div class="progress"><i id="progBar"></i></div>

    <div class="teststage" id="stage">
      <div class="partlbl" id="partLbl"></div>
      <div class="pair">
        <div class="stmt" id="stmtA"><span class="stmt-badge" aria-hidden="true">A</span><span id="stmtAText"></span></div>
        <div class="stmt" id="stmtB"><span class="stmt-badge" aria-hidden="true">B</span><span id="stmtBText"></span></div>
      </div>
      <div class="answer-prompt" id="answerPrompt"></div>

     "Я много думаю о том, кто я и чем отличаюсь от других.",
     "Меня держит не рутина, а смысл.",
     "Лучше всего я выражаю себя через то, что создаю.",
     "Мои настроения меняются, и я отношусь к ним серьёзно — иногда слишком.",
     "Я замечаю то, чего не хватает, легче, чем то, что есть.",
     "Мне часто кажется, что другие не вполне меня видят.",
     "Когда мне больно, я отступаю — и надеюсь, что кто-то заметит."]}},
{n:5,
 en:{name:"The Investigator",tag:"analytical, private, oriented to understanding",
  fear:"being helpless, useless, overwhelmed",desire:"to be capable and competent",
  core:"Attention is organised around understanding before engaging, and around conserving a limited supply of energy. Knowledge is safety: if you grasp how things work, you will not be caught helpless. The strategy buys clarity, independence and real expertise. It costs presence — you are often one step back, watching — and your body and feelings get scheduled for later.",
  outside:"Others experience you as calm and knowledgeable, and as hard to reach. They may read your reserve as coldness or lack of interest when it is actually protection.",
  mislabel:"You probably call it ‘being an introvert’ or ‘needing to think’. Underneath is avarice in the old sense: holding on to time, space and energy because you fear there is not enough.",
  lever:["Act at 70% knowledge on one small thing each week.","Say one feeling out loud, to a person, on the day it happens."],
  adds:"A strong Five adds detachment and depth: a need to understand before committing, and a taste for privacy.",
  stress:"drifts toward the scattered, hyperactive side of Seven — restless, distracted, escaping into stimulation",
  growth:"opens into the confident, embodied side of Eight — acting decisively, taking up space, trusting one's gut",
  s:["I understand complex things quickly and thoroughly.",
     "I stay calm and clear-headed when others are reacting.",
     "I'm independent; I don't need much from others to be fine.",
     "I know a great deal about subjects most people never explore.",
     "People come to me for objective analysis.",
     "I can concentrate on one problem for hours.",
     "I prefer to observe a situation before I join it.",
     "I need a lot of time alone to recharge.",
     "I'd rather understand something fully than act on it half-informed.",
     "A few close people suit me better than many acquaintances.",
     "I process my feelings later, in private.",
     "I question assumptions others take for granted.",
     "Too much social contact wears me out quickly.",
     "I keep my needs small so I don't have to depend on anyone.",
     "I dislike being expected to react on the spot.",
     "I can get absorbed in a subject and forget everything else."]},
 ru:{name:"Исследователь",tag:"аналитичный, закрытый, ориентирован на понимание",
  fear:"оказаться беспомощным, бесполезным, не справиться",desire:"быть способным и компетентным",
  core:"Внимание организовано вокруг понимания до включения — и вокруг экономии ограниченного запаса сил. Знание — это безопасность: если вы понимаете, как всё устроено, вас не застанут беспомощным. Стратегия даёт ясность, независимость и настоящую экспертизу. Цена — присутствие: вы часто на шаг позади, наблюдаете, а тело и чувства откладываются на потом.",
  outside:"Другие видят вас спокойным и знающим — и труднодоступным. Вашу сдержанность могут прочитать как холодность или безразличие, хотя на деле это защита.",
  mislabel:"Вы, скорее всего, называете это «интроверсией» или «мне нужно подумать». Под этим — скупость в старом смысле слова: вы держитесь за время, пространство и силы, потому что боитесь, что их не хватит.",
  lever:["Раз в неделю действуйте при 70% знания в чём-то небольшом.","Произносите одно чувство вслух, человеку, в тот день, когда оно возникло."],
  adds:"Сильная Пятёрка добавляет отстранённость и глубину: потребность понять прежде, чем взять обязательство, и вкус к приватности.",
  stress:"уходит в рассеянную, гиперактивную сторону Семёрки: беспокойство, отвлечение, бегство в стимуляцию",
  growth:"раскрывается в уверенную, телесную сторону Восьмёрки: действует решительно, занимает место, доверяет чутью",
  s:["Я понимаю сложные вещи быстро и основательно.",
     "Я сохраняю спокойствие и ясную голову, когда другие реагируют.",
     "Я независим: мне немногое нужно от других, чтобы быть в порядке.",
     "Я много знаю о том, во что большинство никогда не углубляется.",
     "Ко мне приходят за объективным анализом.",
     "Я могу часами сосредоточенно заниматься одной задачей.",
     "Я предпочитаю понаблюдать за ситуацией, прежде чем в неё включиться.",
     "Мне нужно много времени наедине с собой, чтобы восстановиться.",
     "Я предпочту понять что-то полностью, чем действовать, зная наполовину.",
     "Несколько близких людей мне подходят больше, чем много знакомых.",
     "Свои чувства я разбираю позже, наедине.",
     "Я ставлю под вопрос допущения, которые другие принимают как данность.",
     "Слишком много общения быстро меня истощает.",
     "Я держу свои потребности небольшими, чтобы ни от кого не зависеть.",
     "Мне не нравится, когда от меня ждут реакции сразу, на месте.",
     "Я могу уйти в тему с головой и забыть обо всём остальном."]}},
{n:6,
 en:{name:"The Loyalist",tag:"vigilant, loyal, oriented to security and trust",
  fear:"being without support or guidance",desire:"to have security and support",
  core:"Attention is organised around what could go wrong and who can be trusted. Anticipating trouble is how you stay safe. The strategy buys reliability, foresight and a loyalty that lasts. It costs peace of mind — the scanner never fully turns off — and confidence in your own judgment, because there is always another angle to check.",
  outside:"Others experience you as dependable and sharp, and sometimes as hard to reassure: they answer your doubts and find that new ones appear.",
  mislabel:"You probably call it ‘being realistic’. Underneath is fear — specifically of being without support — and the doubt it produces is a way of never committing to one answer.",
  lever:["Set a decision deadline before you start collecting opinions.","Write down the feared outcome and check it a week later; build a record of your own accuracy."],
  adds:"A strong Six adds caution and loyalty: you check before you trust, and then you stay.",
  stress:"drifts toward the competitive, image-driven side of Three — overworking, performing confidence, avoiding vulnerability",
  growth:"opens into the relaxed, trusting side of Nine — calmer, more accepting, at home in oneself",
  s:["I'm loyal; people can count on me for the long haul.",
     "I see risks early and prepare for them.",
     "I'm a steady, responsible presence when things go wrong.",
     "I ask the questions others are afraid to ask.",
     "I'm good at spotting gaps between what people say and what they do.",
     "I work hard and I show up.",
     "I like to know where I stand and what the rules are.",
     "I'd rather get advice before making a big decision.",
     "I trust people slowly — and then fully.",
     "I feel safer with systems and people I can rely on.",
     "I think through worst cases so I'm not caught off guard.",
     "I'm skeptical of confident people until they've earned it.",
     "I second-guess my own decisions more than I'd like.",
     "Uncertainty bothers me more than bad news.",
     "I look for reassurance and don't fully trust it when I get it.",
     "Under pressure I either freeze or push back hard."]},
 ru:{name:"Лоялист",tag:"бдительный, верный, ориентирован на безопасность и доверие",
  fear:"остаться без поддержки и опоры",desire:"иметь безопасность и поддержку",
  core:"Внимание организовано вокруг того, что может пойти не так и кому можно доверять. Предвидеть беду — ваш способ оставаться в безопасности. Стратегия даёт надёжность, предусмотрительность и верность, которая держится долго. Цена — покой (сканер никогда не выключается полностью) и уверенность в собственном суждении: всегда есть ещё один угол, который надо проверить.",
  outside:"Другие видят вас надёжным и проницательным — и иногда таким, кого трудно успокоить: они отвечают на ваши сомнения и обнаруживают, что появились новые.",
  mislabel:"Вы, скорее всего, называете это «реализмом». Под ним — страх, конкретно страх остаться без опоры, а сомнение, которое он порождает, — способ никогда не остановиться на одном ответе.",
  lever:["Назначайте дедлайн решения до того, как начнёте собирать мнения.","Записывайте пугающий исход и проверяйте через неделю: собирайте данные о собственной точности."],
  adds:"Сильная Шестёрка добавляет осторожность и верность: вы проверяете, прежде чем доверять, а потом остаётесь.",
  stress:"уходит в соревновательную, ориентированную на образ сторону Тройки: перерабатывает, изображает уверенность, избегает уязвимости",
  growth:"раскрывается в расслабленную, доверяющую сторону Девятки: спокойнее, принимающе, дома в самом себе",
  s:["Я верен: на меня можно рассчитывать надолго.",
     "Я рано вижу риски и готовлюсь к ним.",
     "Когда что-то идёт не так, я — устойчивая, ответственная опора.",
     "Я задаю вопросы, которые другие боятся задать.",
     "Я хорошо замечаю расхождения между тем, что люди говорят, и тем, что делают.",
     "Я много работаю и не подвожу.",
     "Мне важно понимать, где я стою и каковы правила.",
     "Перед большим решением я предпочту посоветоваться.",
     "Я доверяю людям медленно — а потом полностью.",
     "Мне спокойнее с системами и людьми, на которых можно опереться.",
     "Я продумываю худшие сценарии, чтобы меня не застали врасплох.",
     "Я скептичен к уверенным людям, пока они не докажут, что им можно верить.",
     "Я перепроверяю свои решения чаще, чем хотелось бы.",
     "Неопределённость беспокоит меня сильнее, чем плохие новости.",
     "Я ищу подтверждения — и не вполне им верю, когда получаю.",
     "Под давлением я либо замираю, либо резко даю отпор."]}},
{n:7,
 en:{name:"The Enthusiast",tag:"curious, upbeat, oriented to possibility",
  fear:"being deprived and trapped in pain",desire:"to be satisfied and content",
  core:"Attention is organised around what is next and what is possible. Staying in motion toward the next interesting thing keeps you ahead of boredom and pain. The strategy buys energy, ideas and resilience. It costs depth and follow-through — and the difficult feelings you outrun tend to wait for you.",
  outside:"Others experience you as fun and quick, and sometimes as slippery: hard to pin down, quick to reframe, not fully there when things get heavy.",
  mislabel:"You probably call it ‘optimism’ or ‘curiosity’. Underneath is gluttony in the old sense — a hunger for more experience — driven by a fear of being trapped in deprivation or pain.",
  lever:["Pick one thing and stay past the point where it gets boring.","When something hurts, wait a full day before finding the silver lining."],
  adds:"A strong Seven adds appetite and lightness: more options, more energy, less patience for limits.",
  stress:"drifts toward the critical, perfectionistic side of One — irritable, judgmental, suddenly rigid",
  growth:"opens into the focused, profound side of Five — going deep, sitting still, finding wonder in one thing",
  s:["I'm optimistic and can find the upside in almost anything.",
     "I lift the energy in a room.",
     "I have many interests and I learn new things fast.",
     "I generate ideas and options faster than most people.",
     "I'm spontaneous and easy to be around.",
     "I bounce back from setbacks quickly.",
     "I like to keep my options open.",
     "Planning a future experience excites me almost as much as having it.",
     "I'd rather try many things than go deep on one.",
     "Routine and tight limits make me restless.",
     "I trust that things will work out.",
     "I move on from what isn't working rather than dwell on it.",
     "I get bored faster than most people.",
     "I say yes to more than I can realistically do.",
     "I'd rather stay busy than sit with a painful feeling.",
     "I skip details when they slow me down."]},
 ru:{name:"Энтузиаст",tag:"любопытный, бодрый, ориентирован на возможности",
  fear:"оказаться обделённым, застрять в боли",desire:"быть удовлетворённым и довольным",
  core:"Внимание организовано вокруг того, что дальше и что возможно. Движение к следующему интересному держит вас впереди скуки и боли. Стратегия даёт энергию, идеи и устойчивость к ударам. Цена — глубина и доведение до конца, а трудные чувства, от которых вы убегаете, обычно дожидаются вас.",
  outside:"Другие видят вас весёлым и быстрым — и иногда неуловимым: трудно зафиксировать, быстро переосмысливаете, не вполне здесь, когда становится тяжело.",
  mislabel:"Вы, скорее всего, называете это «оптимизмом» или «любопытством». Под ними — чревоугодие в старом смысле, голод по новым впечатлениям, а за ним страх застрять в нехватке или в боли.",
  lever:["Выберите одно и оставайтесь дальше точки, где становится скучно.","Когда что-то ранит, подождите полный день, прежде чем искать в этом плюсы."],
  adds:"Сильная Семёрка добавляет аппетит и лёгкость: больше вариантов, больше энергии, меньше терпения к ограничениям.",
  stress:"уходит в критичную, перфекционистскую сторону Единицы: раздражительность, осуждение, внезапная жёсткость",
  growth:"раскрывается в сосредоточенную, глубокую сторону Пятёрки: уходит вглубь, сидит спокойно, находит чудо в одном",
  s:["Я оптимист и почти в чём угодно могу найти плюс.",
     "Я поднимаю энергию в комнате.",
     "У меня много интересов, и я быстро учусь новому.",
     "Я генерирую идеи и варианты быстрее большинства.",
     "Я спонтанен, и со мной легко.",
     "Я быстро восстанавливаюсь после неудач.",
     "Я люблю держать варианты открытыми.",
     "Планировать будущее впечатление мне почти так же радостно, как его проживать.",
     "Я скорее попробую многое, чем уйду вглубь одного.",
     "Рутина и жёсткие рамки вызывают у меня беспокойство.",
     "Я верю, что всё сложится.",
     "Я иду дальше от того, что не работает, а не застреваю в этом.",
     "Мне становится скучно быстрее, чем большинству.",
     "Я соглашаюсь на большее, чем реально могу сделать.",
     "Я скорее буду занят, чем останусь с болезненным чувством.",
     "Я пропускаю детали, когда они меня тормозят."]}},
{n:8,
 en:{name:"The Challenger",tag:"direct, protective, oriented to strength and autonomy",
  fear:"being harmed or controlled by others",desire:"to protect oneself and determine one's own course",
  core:"Attention is organised around power: who has it, who is using it, whether you are safe from it. Strength is how you stay in charge of your own life. The strategy buys courage, decisiveness and fierce protection of your people. It costs tenderness — yours stays hidden, and other people's is hard to receive — and it can crowd out trust.",
  outside:"Others experience you as strong and straightforward, and sometimes as too much: your normal intensity reads as anger to people calibrated differently.",
  mislabel:"You probably call it ‘being honest’ or ‘being strong’. Underneath is a conviction that vulnerability is dangerous, and the armour is thicker than you think.",
  lever:["Let someone else lead one thing that matters to you, and don't rescue it.","Say ‘that hurt’ out loud once a week, before it turns into anger."],
  adds:"A strong Eight adds force and directness: you push, you protect, and you dislike being managed.",
  stress:"drifts toward the withdrawn, secretive side of Five — pulling back, going cold, strategising alone",
  growth:"opens into the open-hearted, caring side of Two — letting people in, protecting with warmth rather than force",
  s:["I take charge when no one else will.",
     "I protect the people I consider mine.",
     "I say what I think, directly and clearly.",
     "I have a lot of energy, and I use it.",
     "I stand up to unfairness even when it's costly.",
     "People know where they stand with me.",
     "I trust my gut over anyone's arguments.",
     "I make decisions quickly and rarely look back.",
     "I respect strength and honesty more than politeness.",
     "I'd rather confront a problem than let it fester.",
     "I test limits to see whether they're real.",
     "I know instinctively who's in charge in a situation.",
     "I don't like anyone having power over me.",
     "Showing softness feels risky to me.",
     "My directness lands harder than I intend.",
     "Being controlled or manipulated makes me angry."]},
 ru:{name:"Бросающий вызов",tag:"прямой, защищающий, ориентирован на силу и автономию",
  fear:"быть уязвлённым или подконтрольным другим",desire:"защитить себя и самому определять свой путь",
  core:"Внимание организовано вокруг силы: у кого она, кто ею пользуется, в безопасности ли вы от неё. Сила — ваш способ оставаться хозяином своей жизни. Стратегия даёт смелость, решительность и яростную защиту своих. Цена — нежность: своя остаётся спрятанной, чужую трудно принять, и она вытесняет доверие.",
  outside:"Другие видят вас сильным и прямым — и иногда «слишком»: ваша обычная интенсивность читается как гнев людьми, настроенными иначе.",
  mislabel:"Вы, скорее всего, называете это «честностью» или «силой». Под ними — убеждение, что уязвимость опасна, и броня толще, чем вам кажется.",
  lever:["Позвольте кому-то другому вести что-то важное для вас — и не спасайте.","Раз в неделю скажите вслух «мне было больно» — до того, как это станет злостью."],
  adds:"Сильная Восьмёрка добавляет напор и прямоту: вы давите, защищаете и не любите, когда вами управляют.",
  stress:"уходит в замкнутую, скрытную сторону Пятёрки: отступает, холодеет, строит стратегию в одиночку",
  growth:"раскрывается в открытую, заботливую сторону Двойки: впускает людей, защищает теплом, а не силой",
  s:["Я беру руль, когда никто другой не берёт.",
     "Я защищаю тех, кого считаю своими.",
     "Я говорю то, что думаю, прямо и ясно.",
     "У меня много энергии, и я её использую.",
     "Я противостою несправедливости, даже когда это дорого стоит.",
     "Люди понимают, как я к ним отношусь.",
     "Я доверяю своему чутью больше, чем чьим-либо аргументам.",
     "Я принимаю решения быстро и редко оглядываюсь.",
     "Я уважаю силу и честность больше, чем вежливость.",
     "Я предпочту встретить проблему лицом к лицу, чем дать ей гноиться.",
     "Я проверяю границы, чтобы понять, настоящие ли они.",
     "Я инстинктивно понимаю, кто главный в ситуации.",
     "Я не люблю, когда у кого-то есть власть надо мной.",
     "Показывать мягкость для меня рискованно.",
     "Моя прямота задевает сильнее, чем я хочу.",
     "Когда меня контролируют или манипулируют мной, я злюсь."]}},
{n:9,
 en:{name:"The Peacemaker",tag:"steady, accepting, oriented to harmony",
  fear:"loss and separation, fragmentation",desire:"to have inner stability and peace of mind",
  core:"Attention is organised around keeping things settled — outside and inside. Avoiding friction is how you stay at peace. The strategy buys calm, patience and a real ability to see everyone's side. It costs your own position: preferences go unspoken, anger goes unfelt, and the important gets deferred to the comfortable.",
  outside:"Others experience you as easy and kind, and sometimes as absent — agreeable in the room but hard to locate: what do you actually want?",
  mislabel:"You probably call it ‘being easygoing’. Underneath is a habit of not showing up for yourself, and the stubbornness that leaks out as delay is anger you don't let yourself feel.",
  lever:["State one preference a day before anyone else states theirs.","Do the most important thing first, for fifteen minutes, before anything comfortable."],
  adds:"A strong Nine adds steadiness and receptivity: you smooth things over, and you can wait.",
  stress:"drifts toward the anxious, reactive side of Six — worried, suspicious, seeking reassurance",
  growth:"opens into the energetic, self-developing side of Three — pursuing goals, showing up, claiming one's worth",
  s:["I have a calming presence; people relax around me.",
     "I can see every side of a disagreement.",
     "I'm patient and steady; I don't create drama.",
     "I accept people as they are.",
     "I'm easy to be with, and I make others feel included.",
     "Once I've started something, I keep at it steadily.",
     "I'd rather adapt than insist.",
     "I need comfort and routine more than excitement.",
     "I often go along with others' preferences; it's easier and usually fine.",
     "I keep the peace, even when I'm right.",
     "I like to feel settled and in harmony with the people around me.",
     "I blend with the people close to me and pick up their views.",
     "It's hard to know what I want when others want something strongly.",
     "I put off important things in favour of small comfortable ones.",
     "When pushed, I quietly dig in rather than argue.",
     "I say ‘it doesn't matter’ when it does."]},
 ru:{name:"Миротворец",tag:"устойчивый, принимающий, ориентирован на гармонию",

/* ============================================================
   PAIR GENERATION — deterministic (fixed seed). 36 type combos
   × 4 meetings = 144 pairs; each type appears 32 times, each of
   its 16 statements exactly twice, no statement-pair repeats.
   Instinct block: 3 combos × 6 = 18 pairs, 6 statements × 2.
   Presentation order shuffles per attempt; pairs never change,
   so attempts stay comparable.
   ============================================================ */
function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;
  t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,rng){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function buildBlock(nItems, nStmts, meetings, seed){
  // items 0..nItems-1; every unordered pair meets `meetings` times
  for(let attempt=0;attempt<200;attempt++){
    const rng=mulberry32(seed+attempt);
    const combos=[];
    for(let a=0;a<nItems;a++)for(let b=a+1;b<nItems;b++)for(let k=0;k<meetings;k++)combos.push([a,b]);
    shuffle(combos,rng);
    const deck=Array.from({length:nItems},()=>{           // each statement used (nItems-1)*meetings/nStmts times
      const reps=(nItems-1)*meetings/nStmts, d=[];
      for(let r=0;r<reps;r++)for(let s=0;s<nStmts;s++)d.push(s);
      return shuffle(d,rng);
    });
    const seen=new Set(), pairs=[];
    let ok=true;
    for(const [a,b] of combos){
      const sa=deck[a].pop(), sb=deck[b].pop();
      const key=a+"#"+sa+"|"+b+"#"+sb;
      if(seen.has(key)){ok=false;break}
      seen.add(key);
      const A={t:a,s:sa},B={t:b,s:sb};
      pairs.push(rng()<0.5?[A,B]:[B,A]);
    }
    if(ok)return pairs;
  }
  throw new Error("pair generation failed");
}
const TYPE_PAIRS = buildBlock(9,16,4,20260903);          // 144 — t is 0-based type index
const INST_PAIRS = buildBlock(3,6,6,20260904);            // 18  — t is instinct index
const N1=TYPE_PAIRS.length, N2=INST_PAIRS.length, NALL=N1+N2;
const pairAt = i => i<N1 ? {kind:"type",pair:TYPE_PAIRS[i]} : {kind:"inst",pair:INST_PAIRS[i-N1]};
const stmtText = (kind,slot) => kind==="type" ? L(TYPES[slot.t]).s[slot.s] : L(INSTINCTS[slot.t]).s[slot.s];

const LS_ATTEMPTS="en_attempts_v1", LS_PROGRESS="en_progress_v1";
let state=null, locked=false;
const $=id=>document.getElementById(id);
const fitBleed=()=>document.documentElement.style.setProperty("--sbw",
  (window.innerWidth-document.documentElement.clientWidth)+"px");
fitBleed();window.addEventListener("resize",fitBleed);
const load=k=>{try{return JSON.parse(lsGet(k))}catch(e){return null}};
const save=(k,v)=>lsSet(k,JSON.stringify(v));
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}

function applyAnswerChoices(){
  const t=T();
  $("scale").setAttribute("aria-label",t.answerGroup);
  [...document.querySelectorAll("#scale .dot")].forEach((button,i)=>{
    const label=t.answerChoices[i];
    button.querySelector(".answer-label").textContent=label;
    button.setAttribute("aria-label",label);
  });
  document.querySelectorAll(".primer-answer-label").forEach((label,i)=>label.textContent=t.answerChoices[i]);
}

function newAttempt(){
  const rng=Math.random;
  const o1=shuffle([...Array(N1).keys()],rng), o2=shuffle([...Array(N2).keys()].map(i=>i+N1),rng);
  return {order:[...o1,...o2], answers:new Array(NALL).fill(undefined), idx:0, interludeSeen:false,
          started:new Date().toISOString()};
}

/* ============================================================
   TEST FLOW
   ============================================================ */
function startTest(resume){
  state = resume ? load(LS_PROGRESS) : newAttempt();
  if(!state){toast(T().toastNothing);return}
  $("intro").style.display="none";$("results").style.display="none";$("primer").style.display="none";
  $("test").style.display="flex";document.body.classList.add("testing");window.scrollTo(0,0);
  showItem();
}
function showItem(){
  if(!state)return;
  if(state.idx>=NALL){finish();return}
  if(state.idx===N1 && !state.interludeSeen){showInterlude();return}
  locked=false;
  const {kind,pair}=pairAt(state.order[state.idx]);
  document.body.classList.toggle("part2",kind==="inst");
  $("stage").style.display="flex";$("interlude").style.display="none";
  $("partLbl").textContent = kind==="type" ? T().part1 : T().part2;
  $("stmtAText").textContent=stmtText(kind,pair[0]);$("stmtBText").textContent=stmtText(kind,pair[1]);
  $("stmtA").classList.remove("picked","hot");$("stmtB").classList.remove("picked","hot");
  document.querySelectorAll(".dot").forEach(d=>d.classList.remove("sel"));
  const i = kind==="type" ? state.idx+1 : state.idx-N1+1, n = kind==="type" ? N1 : N2;
  $("counter").textContent=T().itemOf(i,n);
  $("progBar").style.width=(state.idx/NALL*100)+"%";
}
function showInterlude(){
  const t=T().interlude;
  $("stage").style.display="none";$("interlude").style.display="flex";
  $("ilEyebrow").textContent=t.eyebrow;$("ilTitle").textContent=t.title;
  $("ilP1").textContent=t.p1;$("ilP2").textContent=t.p2;$("ilBtn").textContent=t.btn;
  $("counter").textContent=T().part2;
  $("progBar").style.width=(N1/NALL*100)+"%";
}
$("ilBtn").onclick=()=>{state.interludeSeen=true;save(LS_PROGRESS,state);showItem()};

function answer(v){
  if(locked)return; locked=true;
  state.answers[state.order[state.idx]]=v;
  const dot=document.querySelector(`.dot[data-v="${v}"]`); if(dot)dot.classList.add("sel");
  if(v<0)$("stmtA").classList.add("picked"); if(v>0)$("stmtB").classList.add("picked");
  state.idx++; save(LS_PROGRESS,state);
  setTimeout(showItem,380);
}
$("scale").addEventListener("click",e=>{const d=e.target.closest(".dot");if(d)answer(parseInt(d.dataset.v,10))});
$("scale").addEventListener("mouseover",e=>{const d=e.target.closest(".dot");if(!d||locked)return;
  const v=parseInt(d.dataset.v,10);$("stmtA").classList.toggle("hot",v<0);$("stmtB").classList.toggle("hot",v>0)});
$("scale").addEventListener("mouseleave",()=>{$("stmtA").classList.remove("hot");$("stmtB").classList.remove("hot")});
document.addEventListener("keydown",e=>{
  if($("test").style.display!=="flex"||$("stage").style.display==="none")return;
  const map={"1":-2,"2":-1,"3":0,"4":1,"5":2};
  if(map[e.key]!==undefined)answer(map[e.key]);
});

/* ============================================================
   SCORING — chosen side earns 2 (strong) / 1 (moderate); pct is
   points over 2 × answered appearances. Wing, tritype and the
   instinct stack are derived from the same ranking.
   ============================================================ */
function scoreBlock(pairs, answers, offset, n){
  const t=Array.from({length:n},()=>({pts:0,max:0,strong:0}));
  pairs.forEach((pair,i)=>{
    const v=answers[offset+i]; if(v===null||v===undefined)return;
    const A=t[pair[0].t],B=t[pair[1].t]; A.max+=2;B.max+=2;
    if(v<0){A.pts+=-v;if(v===-2)A.strong++} if(v>0){B.pts+=v;if(v===2)B.strong++}
  });
  return t.map((x,i)=>({i,pct:x.max?x.pts/x.max*100:0,...x}))
          .sort((a,b)=>b.pct-a.pct||b.strong-a.strong||a.i-b.i);
}
function analyze(answers){
  const types=scoreBlock(TYPE_PAIRS,answers,0,9).map(r=>({n:r.i+1,pct:+r.pct.toFixed(1),strong:r.strong}));
  const insts=scoreBlock(INST_PAIRS,answers,N1,3).map(r=>({id:INSTINCTS[r.i].id,pct:+r.pct.toFixed(1),strong:r.strong}));
  const pct={}; types.forEach(r=>pct[r.n]=r.pct);
  const top=types[0].n, lo=top===1?9:top-1, hi=top===9?1:top+1;
  const wing = Math.abs(pct[lo]-pct[hi])<0.5 ? null : (pct[lo]>pct[hi]?lo:hi);
  const tri = Object.keys(CENTERS).map(c=>({c,n:CENTERS[c].types.slice().sort((a,b)=>pct[b]-pct[a])[0]}))
    .sort((a,b)=>pct[b.n]-pct[a.n]);
  const cw={}; Object.keys(CENTERS).forEach(c=>cw[c]=CENTERS[c].types.reduce((s,n)=>s+pct[n],0));
  const cTot=Object.values(cw).reduce((s,x)=>s+x,0)||1;
  const centers=Object.keys(CENTERS).map(c=>({c,share:+(cw[c]/cTot*100).toFixed(1)})).sort((a,b)=>b.share-a.share);
  return {types,insts,top,wing,tri,centers};
}

function finish(){
  const answered=state.answers.filter(v=>v!==null&&v!==undefined).length;
  const a={finished:new Date().toISOString(),started:state.started,answered,skipped:NALL-answered,
           ...analyze(state.answers),responses:state.answers};
  const attempts=load(LS_ATTEMPTS)||[]; attempts.push(a); save(LS_ATTEMPTS,attempts);
  lsDel(LS_PROGRESS); state=null; document.body.classList.remove("part2");
  renderResults(attempts.length-1);
}

/* ============================================================
   ENNEAGRAM DIAGRAM — dot size = score; stress/growth arrows and
   wing highlighted for the lead type.
   ============================================================ */
function enneaSVG(a){
  const cx=150,cy=150,R=112;
  const pos=n=>{const rad=(-90+n*40)*Math.PI/180;return [cx+R*Math.cos(rad),cy+R*Math.sin(rad)]};
  const line=(m,n,cls)=>{const [x1,y1]=pos(m),[x2,y2]=pos(n);return `<line class="${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`};
  const pct={}; a.types.forEach(r=>pct[r.n]=r.pct);
  let s=`<svg class="ennea" viewBox="0 0 300 300" role="img" aria-label="Enneagram">`;
  s+=`<circle class="ring" cx="${cx}" cy="${cy}" r="${R}"/>`;
  [[1,4],[4,2],[2,8],[8,5],[5,7],[7,1],[3,6],[6,9],[9,3]].forEach(([m,n])=>s+=line(m,n,"inner"));
  s+=line(a.top,STRESS[a.top],"stress")+line(a.top,GROWTH[a.top],"growth");
  if(a.wing)s+=line(a.top,a.wing,"wing");
  for(let n=1;n<=9;n++){
    const [x,y]=pos(n), r=5+pct[n]/100*13, C=CENTERS[centerOf(n)];
    s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="var(${C.css})" stroke="${n===a.top?'var(--ink)':'none'}" stroke-width="2"/>`;
    const [lx,ly]=[cx+(R+24)*Math.cos((-90+n*40)*Math.PI/180),cy+(R+24)*Math.sin((-90+n*40)*Math.PI/180)];
    s+=`<text x="${lx}" y="${ly+4}" text-anchor="middle">${n}</text>`;
  }
  return s+`</svg>`;
}

/* ============================================================
   RESULTS
   ============================================================ */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
const typeCode = a => a.wing ? `${a.top}w${a.wing}` : `${a.top}`;
const instName = id => L(INSTINCTS.find(i=>i.id===id)).name;
const instShort = id => INSTINCTS.find(i=>i.id===id)[lang].short;

function renderResults(attemptIdx){
  const attempts=load(LS_ATTEMPTS)||[];
  const a=attempts[attemptIdx]; if(!a)return;
  const prev=attemptIdx>0?attempts[attemptIdx-1]:null;
  const prevRank={}; if(prev)prev.types.forEach((r,i)=>prevRank[r.n]=i+1);
  const t=T(), top=TYPE(a.top), TL=L(top), C=CENTERS[centerOf(a.top)];
  const wingKey=a.wing?`${a.top}w${a.wing}`:null, wing=wingKey?WINGS[lang][wingKey]:null;
  const instCode=a.insts.slice(0,2).map(i=>i.id).join("/");

  const diffKey=(x,y)=>Math.min(x,y)+"-"+Math.max(x,y);
  const D=DIFF[lang];
  const card=(r,i,minor)=>{const ty=TYPE(r.n),X=L(ty),CC=CENTERS[centerOf(r.n)];
    const body = minor
      ? `<p style="margin:10px 0 0;font-size:15px">${esc(X.adds)}</p>
         <div class="blk"><b>${t.yourType(a.top)} ${t.vsHdr} ${t.yourType(r.n)}</b>${esc(D[diffKey(a.top,r.n)])}</div>`
      : `<p style="margin:10px 0 0;font-size:15px">${esc(X.core)}</p>
         <div class="kv"><div class="blk"><b>${t.fear}</b>${X.fear}</div><div class="blk"><b>${t.desire}</b>${X.desire}</div></div>
         <div class="blk"><b>${t.outside}</b>${esc(X.outside)}</div>
         <div class="blk"><b>${t.mislabel}</b>${esc(X.mislabel)}</div>
         <div class="blk"><b>${t.useIt}</b>${X.lever.map(esc).join("<br>")}</div>
         ${wing?`<div class="blk"><b>${t.wingHdr} · ${wingKey} · ${wing[0]}</b>${wing[1]}</div>`:`<div class="blk"><b>${t.wingHdr}</b>${t.balanced}</div>`}`;
    return `<div class="type-card ${minor?'minor':''}" style="--dc:var(${CC.css})">
      <span class="chip">${cName(centerOf(r.n))} · ${t.rankWord} ${i+1} · ${r.pct.toFixed(0)}% · ${t.strongPicks}: ${r.strong}</span>
      <h3>${t.yourType(r.n)} — ${X.name}</h3>
      <div class="statline">${X.tag}</div>
      ${body}
    </div>`};

  let html=`
    <div class="eyebrow">${t.attempt} ${attemptIdx+1} · ${new Date(a.finished).toLocaleString(t.locale)} · ${a.answered}/${NALL} ${t.answered}</div>
    <div class="headline">
      <div>
        <h2>${t.yourType(a.top)}<br>${TL.name}</h2>
        <p class="muted" style="margin:10px 0 0;max-width:40ch">${TL.tag}</p>
        <div class="codechips">
          <span class="codechip solid">${typeCode(a)}</span>
          <span class="codechip">${instCode}</span>
          ${wing?`<span class="codechip">${wing[0]}</span>`:""}
          <span class="codechip">${cName(centerOf(a.top))}</span>
        </div>
      </div>
      ${enneaSVG(a)}
    </div>
    <div class="stackbar">${a.centers.map(c=>`<i style="width:${c.share}%;background:var(${CENTERS[c.c].css})"></i>`).join("")}</div>
    <div class="stacklegend">${a.centers.map(c=>`<span><span class="swatch" style="background:var(${CENTERS[c.c].css})"></span>${cName(c.c)}&nbsp;${c.share.toFixed(0)}%</span>`).join("")}</div>

    <div class="sect"><span class="eyebrow">${t.coreHdr}</span>${card(a.types[0],0,false)}</div>
    <div class="sect"><span class="eyebrow">${t.alsoHdr}</span>${card(a.types[1],1,true)}${card(a.types[2],2,true)}</div>

    <div class="sect"><span class="eyebrow">${t.arrowsHdr}</span>
      <div class="arrows">
        <div class="arrow st"><b>${t.stressLbl} ${STRESS[a.top]}</b><span class="big">${L(TYPE(STRESS[a.top])).name}</span>${esc(TL.stress)}.</div>
        <div class="arrow"><b>${t.growthLbl} ${GROWTH[a.top]}</b><span class="big">${L(TYPE(GROWTH[a.top])).name}</span>${esc(TL.growth)}.</div>
      </div></div>

    <div class="sect"><span class="eyebrow">${t.tritypeHdr} · ${a.tri.map(x=>x.n).join("")}</span>
      <div class="cols3">${a.tri.map(x=>`<div class="tile" style="--dc:var(${CENTERS[x.c].css})">
        <span class="rk">${x.n}</span><span class="nm">${L(TYPE(x.n)).name}</span><span class="sm">${cName(x.c)} · ${a.types.find(r=>r.n===x.n).pct.toFixed(0)}%</span></div>`).join("")}</div></div>

    <div class="sect"><span class="eyebrow">${t.instinctHdr} · ${instCode}</span>
      <div class="ranklist">${a.insts.map((r,i)=>`<div class="rankrow" style="--dc:var(--inst)">
        <span class="muted">${i+1}</span><span class="name">${instShort(r.id)} · ${instName(r.id)}</span>
        <span class="bar"><i style="width:${r.pct}%;background:var(--ink)"></i></span><span style="text-align:right">${r.pct.toFixed(0)}%</span><span></span>
        ${i===0?`<span class="desc">${esc(L(INSTINCTS.find(x=>x.id===r.id)).desc)}</span>`:""}</div>`).join("")}</div></div>

    <div class="sect"><span class="eyebrow">${t.fullRanking}</span><div class="ranklist">`;
  a.types.forEach((r,i)=>{
    const X=L(TYPE(r.n)),CC=CENTERS[centerOf(r.n)];
    let delta="<span></span>";
    if(prev){const d=prevRank[r.n]-(i+1);delta=d>0?`<span class="delta">▲${d}</span>`:d<0?`<span class="delta down">▼${-d}</span>`:`<span class="delta">·</span>`}
    html+=`<div class="rankrow" style="--dc:var(${CC.css})">
      <span class="muted">${i+1}</span>
      <span class="name"><span class="swatch" style="background:var(${CC.css})"></span>${r.n} · ${X.name}</span>
      <span class="bar"><i style="width:${r.pct}%"></i></span><span style="text-align:right">${r.pct.toFixed(0)}%</span>${delta}
      <span class="desc">${X.tag}</span></div>`;
  });

  /* closing summary */
  const V=t.v, neutral=(a.responses||[]).filter(v=>v===0).length, strongTotal=a.types.reduce((s,x)=>s+x.strong,0);
  const gap=+(a.types[0].pct-a.types[1].pct).toFixed(1);
  const n2=a.types[1].n, n3=a.types[2].n, CT=CENTER_TXT[lang];
  const paras=[
    V.lead(a.top,TL.name,typeCode(a),instName(a.insts[0].id))+" "+TL.core,
    (gap<6 ? V.diffClose(a.top,n2,a.types[0].pct.toFixed(0),a.types[1].pct.toFixed(0)) : V.diffClear(a.top,n2,gap.toFixed(0)))+D[diffKey(a.top,n2)],
    V.adds(n2,n3)+L(TYPE(n2)).adds+" "+L(TYPE(n3)).adds,
    CT.lead[a.centers[0].c]+" "+CT.low[a.centers[2].c]+" "+V.tritype(a.tri.map(x=>x.n).join("")),
    V.arrows(a.top,STRESS[a.top],TL.stress,GROWTH[a.top],TL.growth),
    V.inst(instName(a.insts[0].id),instName(a.insts[1].id),instName(a.insts[2].id)),
    neutral<=a.answered*0.15 ? V.confident(neutral,a.answered,strongTotal) : V.unsure(neutral)
  ];
  html+=`</div></div>
    <div class="sect"><span class="eyebrow">${V.hdr}</span><div class="verdict">${paras.map(p=>`<p>${p}</p>`).join("")}</div></div>
    <div class="row" style="margin-top:30px">
      <button class="btn" id="copyBtn">${t.copy}</button>
      <button class="btn2" id="dlBtn">${t.dl}</button>
      <button class="btn2" id="pdfBtn">${t.pdf}</button>
      <button class="btn2" id="againBtn">${t.again}</button>
      <button class="btn2" id="homeBtn">${t.home}</button>
    </div>
    <p class="muted" style="font-size:13px;max-width:60ch">${t.copyNote}</p>`;

  $("test").style.display="none";$("intro").style.display="none";document.body.classList.remove("testing");
  const res=$("results");res.innerHTML=html;res.style.display="block";res.dataset.attempt=attemptIdx;window.scrollTo(0,0);

  const exportObj=()=>({
    tool:"Enneagram Profiler (unofficial RHETI-style)", uiLanguage:lang,
    attempt:attemptIdx+1, finished:a.finished, answered:a.answered, skipped:a.skipped,
    type:{number:a.top,name:TYPE(a.top).en.name,wing:a.wing,code:typeCode(a),center:centerOf(a.top),
          stressPoint:STRESS[a.top],growthPoint:GROWTH[a.top]},
    tritype:a.tri.map(x=>x.n).join(""),
    instinctStack:a.insts.map(i=>({instinct:i.id,pct:i.pct})),
    centers:Object.fromEntries(a.centers.map(c=>[c.c,c.share])),
    ranking:a.types.map((r,i)=>({rank:i+1,type:r.n,name:TYPE(r.n).en.name,pct:r.pct,strongPicks:r.strong})),
    closingSummary:paras,
    previousTop3: prev ? prev.types.slice(0,3).map(r=>r.n) : null
  });
  $("copyBtn").onclick=()=>navigator.clipboard.writeText(JSON.stringify(exportObj(),null,2)).then(()=>toast(t.toastCopied)).catch(()=>toast(t.toastFail));
  $("dlBtn").onclick=()=>{const b=new Blob([JSON.stringify(exportObj(),null,2)],{type:"application/json"});
    const u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download=`enneagram-attempt-${attemptIdx+1}.json`;l.click();URL.revokeObjectURL(u)};
  $("pdfBtn").onclick=()=>window.print();
  $("againBtn").onclick=()=>{lsDel(LS_PROGRESS);startTest(false)};
  $("homeBtn").onclick=()=>{res.style.display="none";$("intro").style.display="block";renderHistory()};
}

/* ============================================================
   HISTORY / LANGUAGE / WIRING
   ============================================================ */
function renderHistory(){
  const attempts=load(LS_ATTEMPTS)||[], h=$("history");
  if(!attempts.length){h.innerHTML="";return}
  let html=`<div class="eyebrow" style="margin-bottom:10px">${T().past}</div><div style="display:grid;gap:8px">`;
  attempts.forEach((a,i)=>{
    html+=`<div class="histrow"><div><b>${T().attempt} ${i+1}</b> <span class="muted" style="font-size:13px">· ${new Date(a.finished).toLocaleDateString(T().locale)}</span><br>
      <span class="muted" style="font-size:13px">${typeCode(a)} · ${L(TYPE(a.top)).name} · ${a.insts.slice(0,2).map(x=>x.id).join("/")}</span></div>
      <button class="btn2" data-i="${i}">${T().view}</button></div>`;
  });
  h.innerHTML=html+`</div>`;
  h.querySelectorAll("button").forEach(b=>b.onclick=()=>renderResults(parseInt(b.dataset.i,10)));
}
function applyLang(){
  const t=T(); document.documentElement.lang=lang;
  $("langBtn").textContent= lang==="en"?"RU":"EN";
  $("iEyebrow").textContent=t.eyebrow;$("iTitle").textContent=t.title;$("iSub").textContent=t.sub;
  $("iS1").textContent=t.s1;$("iS2").textContent=t.s2;$("iS3").textContent=t.s3;$("iS4").textContent=t.s4;$("iNote").textContent=t.note;
  $("iDomLine").innerHTML=Object.keys(CENTERS).map(c=>`<span><span class="swatch" style="background:var(${CENTERS[c].css})"></span>${cName(c)} · ${CENTERS[c].types.join(" ")}</span>`).join("");
  $("startBtn").textContent=t.start;$("resumeBtn").textContent=t.resume;$("exitBtn").textContent=t.exit;
  $("pEyebrow").textContent=t.primer.eyebrow;$("pTitle").textContent=t.primer.title;
  $("pList").innerHTML=t.primer.items.map((x,i)=>`<div class="prule"><span class="n">0${i+1}</span><span>${x}</span></div>`).join("");
  $("pMini").innerHTML=`<span>${t.primer.miniL}</span><span>${t.primer.miniC}</span><span>${t.primer.miniR}</span>`;
  $("primerBtn").textContent=t.primer.btn;
  $("lblL").innerHTML=t.lblStrong;$("lblC").textContent=t.lblNeutral;$("lblR").innerHTML=t.lblStrong;
  $("answerPrompt").textContent=t.answerPrompt;
  $("choiceHelpTitle").textContent=t.choiceHelpTitle;$("choiceHelpText").textContent=t.choiceHelpText;
  applyAnswerChoices();
  document.title= lang==="ru" ? "Профиль эннеаграммы — тест в духе RHETI" : "Enneagram Profiler — RHETI-style assessment";
  renderHistory();
  if($("test").style.display==="flex" && state){
    if($("interlude").style.display==="flex")showInterlude(); else if(state.idx<NALL){locked=false;showItem()}
  }
  const res=$("results");
  if(res.style.display==="block"&&res.dataset.attempt!==undefined)renderResults(parseInt(res.dataset.attempt,10));
}
$("langBtn").onclick=()=>{lang=lang==="en"?"ru":"en";lsSet("en_lang",lang);applyLang()};
$("exitBtn").onclick=()=>{
  if(state)save(LS_PROGRESS,state);
  $("test").style.display="none";$("intro").style.display="block";document.body.classList.remove("testing","part2");
  $("resumeBox").style.display="block";renderHistory();window.scrollTo(0,0);toast(T().toastExit);
};
$("startBtn").onclick=()=>{lsDel(LS_PROGRESS);$("intro").style.display="none";$("results").style.display="none";$("primer").style.display="block";window.scrollTo(0,0)};
$("primerBtn").onclick=()=>startTest(false);
$("resumeBtn").onclick=()=>startTest(true);
if(load(LS_PROGRESS))$("resumeBox").style.display="block";
$("iStrand").innerHTML=[8,9,1,2,3,4,5,6,7].map(n=>`<i style="--sc:var(${CENTERS[centerOf(n)].css})" title="${n}"></i>`).join("");
applyLang();
