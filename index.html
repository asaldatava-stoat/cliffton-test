<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psych Tests — self-hosted personality assessments</title>
<style>
  :root{
    --bg:#FFFFFF; --ink:#000000; --ink2:rgba(0,0,0,.55); --line:#000000; --line2:rgba(0,0,0,.14);
    --soft:rgba(0,0,0,.05); --gut:clamp(20px,5vw,64px);
    --lav:#CDABFE; --org:#FE7445; --blu:#33AAFF; --sage:#D1DDD3;
    --grot:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    --mono:"Geist Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--grot);font-weight:500;letter-spacing:-.01em;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .eyebrow{font-family:var(--mono);font-size:12px;text-transform:uppercase;font-weight:400;letter-spacing:0}
  .hero{background:var(--ink);color:#fff;padding:18px var(--gut) 64px}
  .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(60px,16vh,150px)}
  .brandchip{background:#fff;color:var(--ink);font-weight:700;font-size:20px;letter-spacing:-.03em;padding:4px 10px 6px}
  .langbtn{background:#fff;color:var(--ink);border:none;padding:8px 14px;font-family:var(--mono);font-size:13px;cursor:pointer}
  h1{font-size:clamp(44px,11vw,140px);line-height:.9;margin:12px 0 26px;letter-spacing:-.055em;font-weight:500;text-wrap:balance}
  .sub{font-size:clamp(16px,1.5vw,20px);max-width:56ch;margin:0;line-height:1.35}
  .grid{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
  .card{display:flex;flex-direction:column;padding:34px var(--gut) 40px;min-height:min(60vh,560px);position:relative;
    transition:filter .15s}
  .card+.card{border-left:1px solid var(--line)}
  .card:hover{filter:brightness(.96)}
  .card .eyebrow{display:flex;justify-content:space-between}
  .card h2{font-size:clamp(34px,5vw,64px);letter-spacing:-.05em;line-height:.95;margin:clamp(40px,8vh,90px) 0 16px;font-weight:500}
  .card p{margin:0;max-width:44ch;font-size:15px;line-height:1.45}
  .card dl{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:auto 0 0;padding-top:34px}
  .card dt{font-size:clamp(26px,3vw,40px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .card dd{margin:6px 0 0;font-family:var(--mono);font-size:10px;text-transform:uppercase;color:rgba(0,0,0,.6);line-height:1.4}
  .card .go{margin-top:28px;display:inline-block;background:var(--ink);color:#fff;padding:14px 26px;font-size:15px;align-self:flex-start}
  .card.clifton{background:var(--lav)}
  .card.ennea{background:var(--sage)}
  .strand{display:flex;gap:2px;height:14px}
  .strand i{flex:1;display:block}
  .foot{padding:26px var(--gut) 60px;font-size:14px;color:var(--ink2);max-width:70ch}
  .foot a{text-decoration:underline;text-underline-offset:3px}
  @media (max-width:700px){.grid{grid-template-columns:1fr}.card+.card{border-left:none;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header class="hero">
  <div class="topline"><span class="brandchip">PT 26</span><button class="langbtn" id="langBtn">RU</button></div>
  <div class="eyebrow" data-i="eyebrow"></div>
  <h1 data-i="title"></h1>
  <p class="sub" data-i="sub"></p>
</header>

<div class="grid">
  <a class="card clifton" href="clifton/">
    <div class="eyebrow"><span data-i="c1e"></span><span>01</span></div>
    <h2 data-i="c1t"></h2>
    <p data-i="c1p"></p>
    <dl><div><dt>177</dt><dd data-i="c1a"></dd></div><div><dt>34</dt><dd data-i="c1b"></dd></div><div><dt>20s</dt><dd data-i="c1c"></dd></div></dl>
    <span class="go" data-i="go"></span>
  </a>
  <a class="card ennea" href="enneagram/">
    <div class="eyebrow"><span data-i="c2e"></span><span>02</span></div>
    <h2 data-i="c2t"></h2>
    <p data-i="c2p"></p>
    <dl><div><dt>144</dt><dd data-i="c2a"></dd></div><div><dt>9</dt><dd data-i="c2b"></dd></div><div><dt>+18</dt><dd data-i="c2c"></dd></div></dl>
    <span class="go" data-i="go"></span>
  </a>
</div>
<div class="strand" aria-hidden="true"><i style="background:var(--lav)"></i><i style="background:var(--org)"></i><i style="background:var(--blu)"></i><i style="background:var(--sage)"></i></div>
<p class="foot" data-i="foot"></p>

<script>
const STR={
en:{eyebrow:"Self-hosted · unofficial reconstructions",title:"Psych Tests",
  sub:"Personality assessments rebuilt from their public mechanics, with original statements. Results stay in your browser; export JSON to analyse with Claude.",
  c1e:"34 talent themes",c1t:"Strengths Profiler",
  c1p:"Paired statements under a 20-second clock rank all 34 talent themes across four domains. Top-10 in detail, domain balance, composed closing summary.",
  c1a:"paired statements",c1b:"talent themes",c1c:"per item",
  c2e:"9 types · instincts",c2t:"Enneagram Profiler",
  c2p:"144 balanced pairs rank the nine types; a short second part ranks your instincts. Type, wing, tritype, stress and growth arrows, instinct stack.",
  c2a:"paired statements",c2b:"types",c2c:"instinct pairs",
  go:"Open the test →",
  foot:"Not affiliated with Gallup or the Enneagram Institute. Everything runs locally in a single HTML file per test; attempts are stored in your browser only."},
ru:{eyebrow:"Самостоятельный хостинг · неофициальные реконструкции",title:"Психологические тесты",
  sub:"Личностные тесты, воссозданные по открытой механике, с оригинальными формулировками. Результаты остаются в браузере; JSON можно выгрузить для разбора с Claude.",
  c1e:"34 таланта",c1t:"Профиль сильных сторон",
  c1p:"Парные утверждения с таймером 20 секунд ранжируют все 34 таланта по четырём доменам. Топ-10 подробно, баланс доменов, собранное заключение.",
  c1a:"парных утверждений",c1b:"таланта",c1c:"на вопрос",
  c2e:"9 типов · инстинкты",c2t:"Профиль эннеаграммы",
  c2p:"144 сбалансированные пары ранжируют девять типов; короткая вторая часть — инстинкты. Тип, крыло, тритип, стрелки стресса и роста, стек инстинктов.",
  c2a:"парных утверждения",c2b:"типов",c2c:"пар на инстинкт",
  go:"Открыть тест →",
  foot:"Не связано с Gallup и Enneagram Institute. Всё работает локально, один HTML-файл на тест; попытки хранятся только в вашем браузере."}};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
let lang=lsGet("pt_lang")||((navigator.language||"").startsWith("ru")?"ru":"en");
function apply(){document.documentElement.lang=lang;document.getElementById("langBtn").textContent=lang==="en"?"RU":"EN";
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=STR[lang][e.dataset.i]);
  document.title=lang==="ru"?"Психологические тесты":"Psych Tests — self-hosted personality assessments"}
document.getElementById("langBtn").onclick=()=>{lang=lang==="en"?"ru":"en";try{localStorage.setItem("pt_lang",lang)}catch(e){}apply()};
apply();
</script>
</body>
</html>
