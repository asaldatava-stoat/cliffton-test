<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psych Tests — see how you're wired</title>
<meta name="description" content="Two free personality tests: your five signature strengths and your Enneagram type. No sign-up; answers stay in your browser.">
<!-- BRAND:START v2 — keep identical across pages; see /brand/ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style id="brand-kit">
  :root{
    --b-ink:#000000; --b-paper:#FFFFFF; --b-graphite:#262626;
    --b-org:#FE7445; --b-lav:#CDABFE; --b-blu:#33AAFF; --b-sage:#D1DDD3;
    --b-org-soft:#FFE9E0; --b-lav-soft:#F3ECFF; --b-blu-soft:#E3F2FF; --b-sage-soft:#EDF2EE;
    --b-grot:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    --b-accent:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --b-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
    --b-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --gl:rgba(0,0,0,.22); --cols:6; --row:92px;
  }
  .on-dark{--gl:rgba(255,255,255,.18)}
  /* one italic accent word per headline */
  .acc{font-family:var(--b-accent);font-style:italic;font-weight:500;letter-spacing:-.02em;font-size:1.13em;line-height:.8}
  /* margin notes — at most one per screen */
  .hand{font-family:var(--b-hand);font-weight:500;letter-spacing:0;text-transform:none;line-height:1}
  /* the visible grid */
  .gridbg{background-image:linear-gradient(to right,var(--gl) 1px,transparent 1px),
    linear-gradient(to bottom,var(--gl) 1px,transparent 1px);background-size:calc(100% / var(--cols)) var(--row)}
  .cells{display:grid;grid-template-columns:repeat(var(--cols),1fr);min-height:48px;border-bottom:1px solid var(--gl);
    font-family:var(--b-mono);font-size:11px;font-weight:400;letter-spacing:0;text-transform:uppercase}
  .cells>*{display:flex;align-items:center;padding:0 12px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cells a{color:inherit;text-decoration:none}
  .cells a:hover{text-decoration:underline;text-underline-offset:3px}
  /* hand-drawn marks */
  .sc{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
  /* draw-in: lengths are measured by the script below; without JS the marks are simply shown */
  .b-anim .draw path{animation:b-draw 1.15s .35s cubic-bezier(.65,.05,.3,1) forwards}
  .b-anim .draw path+path{animation-delay:1.35s;animation-duration:.35s}
  @keyframes b-draw{to{stroke-dashoffset:0}}
  .art{display:block;width:100%;height:auto;color:var(--b-ink);overflow:visible}
  .art .num{font-family:var(--b-mono);font-size:12px;fill:currentColor}
  .art .note{font-family:var(--b-hand);font-size:25px;font-weight:600;fill:currentColor}
  @media (max-width:700px){
    :root{--cols:3;--row:76px}
    .cells>:nth-child(2),.cells>:nth-child(4),.cells>:nth-child(5){display:none}
  }
</style>
<script>document.addEventListener("DOMContentLoaded",function(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  document.querySelectorAll(".draw path").forEach(function(p){var L=Math.ceil(p.getTotalLength())+2;
    p.style.strokeDasharray=L;p.style.strokeDashoffset=L});
  document.documentElement.classList.add("b-anim");
});</script>
<!-- BRAND:END -->
<style>
  :root{--ink:#000;--paper:#fff;--ink2:rgba(0,0,0,.6);--gut:clamp(20px,4vw,48px)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--b-grot);font-weight:500;letter-spacing:-.01em;
    line-height:1.45;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .eyebrow{font-family:var(--b-mono);font-size:12px;font-weight:400;letter-spacing:0;text-transform:uppercase}
  .langbtn{position:fixed;top:9px;right:12px;z-index:10;background:var(--paper);color:var(--ink);border:none;
    padding:8px 13px;font-family:var(--b-mono);font-size:12px;cursor:pointer}
  .langbtn:focus-visible,.test:focus-visible{outline:3px solid var(--b-blu);outline-offset:-3px}

  /* hero */
  .hero{background-color:var(--b-ink);color:var(--paper)}
  .herogrid{display:grid;grid-template-columns:repeat(var(--cols),1fr);padding:clamp(56px,11vh,120px) 0 clamp(48px,8vh,88px);position:relative}
  .herotext{grid-column:2/7;padding:0 14px}
  h1{font-size:clamp(44px,9.6vw,150px);line-height:.88;letter-spacing:-.06em;font-weight:500;margin:18px 0 30px}
  h1 .acc{color:var(--b-lav)}
  .sub{font-size:clamp(17px,1.6vw,22px);line-height:1.32;max-width:34ch;margin:0}
  .meta{margin:22px 0 0;color:rgba(255,255,255,.6)}
  .herohand{position:absolute;right:calc(100% / var(--cols) * .55);bottom:clamp(30px,6vh,64px);width:clamp(90px,10vw,150px);
    color:var(--b-org);transform:rotate(78deg)}


  /* the two tests */
  .tests{display:grid;grid-template-columns:1fr 1fr}
  .test{position:relative;display:flex;flex-direction:column;min-height:clamp(620px,92vh,860px);transition:filter .15s}
  .test:hover{filter:brightness(.97)}
  .test+.test{border-left:1px solid var(--ink)}
  .test.org{background-color:var(--b-org)}
  .test.lav{background-color:var(--b-lav)}
  /* every card has the same skeleton, so titles, stats and buttons share one height across both cards:
     header + top pad = 1 grid row, illustration area = 4 rows, text starts on the next row line */
  .test .tbody{display:flex;flex-direction:column;flex:1;padding-top:calc(var(--row) - 48px)}
  .test .tart{height:calc(var(--row) * 4);width:min(80%,440px);margin-left:calc(100% / var(--cols));display:flex;align-items:center}
  .test .tart .art{width:100%;height:100%}
  .test .tag{margin:14px 0 12px}
  /* text starts on the first column line and sits 14px inside it */
  .test .ttext{padding:0 calc(100% / var(--cols)) 0 14px}
  .test h2{font-size:clamp(38px,4.6vw,72px);line-height:.92;letter-spacing:-.055em;font-weight:500;margin:0 0 16px}
  .test p{margin:0;max-width:38ch;font-size:clamp(15px,1.2vw,17px);line-height:1.4}
  /* stats = three grid cells: each two columns wide, exactly one row tall, sitting on grid lines.
     The card height is rounded to whole rows in JS so this strip lands on a line. */
  .test .stats{display:grid;grid-template-columns:repeat(3,1fr);height:var(--row);margin:28px 0 0;margin-top:auto;
    border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
  .test .stats>div{display:flex;flex-direction:column;justify-content:space-between;padding:12px 14px 11px}
  .test .stats>div+div{border-left:1px solid var(--ink)}
  .test dt{font-size:clamp(28px,2.8vw,42px);letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums}
  .test dd{margin:0;font-family:var(--b-mono);font-size:10px;text-transform:uppercase;line-height:1.2}
  .test .gorow{height:var(--row);display:flex;align-items:center;padding:0 14px}
  .test .go{display:inline-block;background:var(--ink);color:var(--paper);padding:15px 26px;font-size:15px}
  .test .ttext p{margin-bottom:28px}
  .test:hover .go{background:#222}

  .cells .span3{grid-column:span 3}
  @media (max-width:700px){.test .cells>:not(:first-child){display:none}}
  .foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 30px;padding:22px var(--gut) 50px;
    border-top:1px solid var(--ink);color:var(--ink2);font-size:13px}
  .foot a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

  @media (max-width:1000px){.herotext{grid-column:1/-1;padding:0 var(--gut)}.herohand{display:none}}
  @media (max-width:860px){
    .tests{grid-template-columns:1fr}.test+.test{border-left:none;border-top:1px solid var(--ink)}
    .test{min-height:0}
  }
  @media (max-width:700px){
    .test .tart{height:calc(var(--row) * 3);margin-left:14px;width:min(calc(100% - 28px),340px)}
    .test .ttext{padding:0 14px}
  }
</style>
</head>

<script>
const STR={
en:{cell2:"Two tests",cell3:"Free",cell4:"No sign-up",
  eyebrow:"Two free tests · about 25 minutes each",
  title:'See how<br>you’re <span class="acc">wired.</span>',
  sub:"Two tests that make you choose — and in choosing, show what you actually lean on at work and in life.",
  meta:"No sign-up · Your answers never leave this browser",
  c1tag:"What you’re best at",c2tag:"Why you do what you do",
  c1k:"Test 01 · Strengths",c1m:"22–30 min",c1n:"your top 5",
  c1t:'Strengths <span class="acc">Profiler</span>',
  c1p:"Find the five talents you lean on without noticing — and the price each one quietly charges.",
  c1a:"talents",c1b:"domains",c1c:"that define you",go1:"Take the strengths test →",
  c2k:"Test 02 · Personality",c2m:"15–35 min",c2n:"you?",
  c2t:'Enneagram <span class="acc">Profiler</span>',
  c2p:"Not what you do — why you do it. Your type, the fear that drives it, and where you go under stress.",
  c2a:"types",c2b:"instincts",c2c:"that is yours",go2:"Take the Enneagram test →",
  foot:"Independent project · not affiliated with Gallup or the Enneagram Institute",brand:"Brand guidelines",
  doc:"Psych Tests — see how you’re wired"},
ru:{cell2:"Два теста",cell3:"Бесплатно",cell4:"Без регистрации",
  eyebrow:"Два бесплатных теста · около 25 минут каждый",
  title:'Узнайте,<br>как вы <span class="acc">устроены.</span>',
  sub:"Два теста, в которых нужно выбирать, — и именно выбор показывает, на что вы на самом деле опираетесь в работе и жизни.",
  meta:"Без регистрации · Ответы не покидают ваш браузер",
  c1tag:"В чём вы лучше всего",c2tag:"Почему вы так поступаете",
  c1k:"Тест 01 · Сильные стороны",c1m:"22–30 мин",c1n:"ваш топ-5",
  c1t:'Профиль <span class="acc">сильных сторон</span>',
  c1p:"Найдите пять талантов, на которые вы опираетесь не замечая, — и цену, которую каждый из них тихо берёт.",
  c1a:"талантов",c1b:"домена",c1c:"главных — ваши",go1:"Пройти тест сильных сторон →",
  c2k:"Тест 02 · Личность",c2m:"15–35 мин",c2n:"это вы?",
  c2t:'Профиль <span class="acc">эннеаграммы</span>',
  c2p:"Не что вы делаете, а почему. Ваш тип, страх, который им движет, и куда вас уводит стресс.",
  c2a:"типов",c2b:"инстинкта",c2c:"из них — ваш",go2:"Пройти тест по эннеаграмме →",
  foot:"Независимый проект · не связан с Gallup и Enneagram Institute",brand:"Брендбук",
  doc:"Psych Tests — узнайте, как вы устроены"}};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
let lang=lsGet("pt_lang")||((navigator.language||"").startsWith("ru")?"ru":"en");
function apply(){const t=STR[lang];document.documentElement.lang=lang;
  document.getElementById("langBtn").textContent=lang==="en"?"RU":"EN";
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
  document.querySelectorAll("[data-h]").forEach(e=>e.innerHTML=t[e.dataset.h]);
  document.title=t.doc}
/* keep the stats strip on a grid line: card height = whole number of grid rows */
function snapCards(){
  const cards=[...document.querySelectorAll(".test")]; if(!cards.length)return;
  cards.forEach(c=>c.style.minHeight="");
  const row=parseFloat(getComputedStyle(cards[0]).getPropertyValue("--row"))||92;
  cards.forEach(c=>{const h=c.getBoundingClientRect().height;c.style.minHeight=Math.ceil(h/row-.01)*row+"px"});
}
document.getElementById("langBtn").onclick=()=>{lang=lang==="en"?"ru":"en";try{localStorage.setItem("pt_lang",lang)}catch(e){}apply();snapCards()};
apply();snapCards();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(snapCards);
addEventListener("load",snapCards);
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(snapCards,80)});
</script>
